name: cancel-watch

on:
  schedule:
    - cron: "0 * * * *"   # 1時間ごとに起動（実行中なら待機し、途切れず監視が続く）
  workflow_dispatch:
    inputs:
      debug:
        description: "テスト実行（3分だけ動かし、スクショを保存）"
        type: boolean
        default: true

concurrency:
  group: cancel-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Watch
        run: python monitor.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          DURATION_MIN: ${{ inputs.debug && '3' || '340' }}
          INTERVAL_SEC: "60"
          MONTHS_AHEAD: "1"
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
